name: Upgrade Demo Builder generator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade generator
        run: python scripts/upgrade_demo_generator.py

      - name: Validate Python
        run: python -m py_compile app/main.py app/demo_template.py

      - name: Commit generator upgrade
        run: |
          if git diff --quiet -- app/main.py; then
            echo "No generator changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git commit -m "Upgrade Demo Builder generator [skip ci]"
          git push
