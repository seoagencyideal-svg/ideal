name: Upgrade Demo Builder generator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade generator
        run: python scripts/upgrade_demo_generator.py

      - name: Validate Python
        run: python -m py_compile app/main.py app/demo_template.py

      - name: Commit generator upgrade and validation marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Advanced Demo Builder generator validated by Python compile.\n' > DEMO_GENERATOR_VALIDATED.txt
          git add app/main.py DEMO_GENERATOR_VALIDATED.txt
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Validate advanced Demo Builder generator [skip ci]"
          git push
